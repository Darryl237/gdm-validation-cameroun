<!DOCTYPE html>
<html lang="fr">
<head>

<title>Accès Rapide — GDM Validation Project</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #1B2A4A, #6B46C1);
    min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: white; border-radius: 16px; padding: 48px; max-width: 560px; width: 90%;

  p.subtitle { color: #64748b; font-size: 0.95em; margin-bottom: 36px; }
  a.btn {
    display: block; text-decoration: none; padding: 20px 24px; border-radius: 12px;
    margin-bottom: 16px; font-weight: 700; font-size: 1.1em; transition: transform 0.15s;
  }
  a.btn:hover { transform: translateY(-2px); }
  a.btn-app { background: linear-gradient(135deg, #6B46C1, #1B2A4A); color: white; }
  a.btn-github { background: #1e293b; color: white; }
  a.btn small { display: block; font-weight: 400; font-size: 0.7em; opacity: 0.85; margin-top: 4px; }
  .footer { margin-top: 28px; font-size: 0.8em; color: #94a3b8; }

  <div class="card">

  </div>
